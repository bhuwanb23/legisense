name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/release-keystore.jks
            echo "keystore_decoded=true" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_decoded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret found. Building with debug signing."
          fi
        id: keystore

      - name: Write key.properties
        if: steps.keystore.outputs.keystore_decoded == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > app/android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          PROPS

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Flutter test
        working-directory: app
        run: flutter test --no-pub

      - name: Build APK (release)
        working-directory: app
        run: flutter build apk --release --no-pub

      - name: Build App Bundle (release)
        working-directory: app
        run: flutter build appbundle --release --no-pub

      - name: Get version
        id: version
        run: |
          cd app
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legisense-${{ steps.tag.outputs.tag }}-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: legisense-${{ steps.tag.outputs.tag }}-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Legisense ${{ steps.tag.outputs.tag }}"
          body: |
            ## Legisense ${{ steps.tag.outputs.tag }}

            ### Downloads
            - **APK** - Install directly on Android devices
            - **AAB** - Upload to Google Play Console

            ### What's Changed
            See commit history for details.
          draft: false
          prerelease: false
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
