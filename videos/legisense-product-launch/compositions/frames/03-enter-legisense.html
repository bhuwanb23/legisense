    #root [class~="03-enter-legisense-glow"] {

  <div

  >
    <!-- track 0 · full-duration white ground -->
    <div
      class="clip 03-enter-legisense-ground"
      data-start="0"

    <!-- track 1 · the lockup stage -->
    <div
      class="clip 03-enter-legisense-stage"
      data-start="0"

    >
      <div class="03-enter-legisense-tilewrap">
        <div class="03-enter-legisense-glow" id="03-enter-legisense-glow"></div>

            <circle

            <path id="03-enter-legisense-glyph-handle" d="M 73.5 73.5 L 96 96" />
            <path id="03-enter-legisense-glyph-shaft" d="M 52 66 L 52 38" />
            <path id="03-enter-legisense-glyph-head" d="M 41.5 48.5 L 52 38 L 62.5 48.5" />
          </svg>
        </div>
      </div>

      <h1 class="03-enter-legisense-wordmark" id="03-enter-legisense-wordmark"
        ><span class="03-enter-legisense-wgroup" id="03-enter-legisense-wg0">Le</span
        ><span class="03-enter-legisense-wgroup" id="03-enter-legisense-wg1">gi</span
        ><span class="03-enter-legisense-wgroup" id="03-enter-legisense-wg2">Sen</span
        ><span class="03-enter-legisense-wgroup" id="03-enter-legisense-wg3">se</span></h1
      >

      <p class="03-enter-legisense-tagline" id="03-enter-legisense-tagline">

      <div class="03-enter-legisense-accentwrap">
        <svg
          class="03-enter-legisense-accent"
          width="60"

        >
          <line
            id="03-enter-legisense-accent-line"
            x1="3"

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "03-enter-legisense";
      var DUR = 3.712;

      // Scene windows (packet 0-8.0s) mapped proportionally onto the fixed 3.712s duration:
      //   Scene 1 0.000-1.021 · mark seats + glyph self-draw finishing on "LegiSense"
      //   Scene 2 1.021-1.949 · wordmark cascades (tracking tightens), tagline fades up on cue
      //   Scene 3 1.949-3.712 · accent line draws, single bounded glow blooms once, hold
      var S2 = (2.2 / 8) * DUR; // 1.021
      var S3 = (4.2 / 8) * DUR; // 1.949

      var $ = function (id) {
        return document.getElementById(FRAME_ID + "-" + id);
      };
      var tile = $("tile");
      var glow = $("glow");
      var wordmark = $("wordmark");
      var tagline = $("tagline");
      var groups = [$("wg0"), $("wg1"), $("wg2"), $("wg3")];
      var strokes = [$("glyph-lens"), $("glyph-handle"), $("glyph-shaft"), $("glyph-head")];
      var accentLine = $("accent-line");

      // ── svg-path-draw setup: measured lengths, never guessed ──
      var lensLen = strokes[0].getTotalLength();
      var accentLen = accentLine.getTotalLength();
      strokes.forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      accentLine.style.strokeDasharray = String(accentLen);
      accentLine.style.strokeDashoffset = String(accentLen);

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;

      // hold-extend: keep the timeline alive across the full wrapper window
      tl.set({}, {}, 7.5);

      // ═══ Scene 1 (0 - 1.021s) · ink tile seats center; glyph self-draws ═══

      // tile seats center — calm spring-pop settle (power3.out, no bounce: light pro brand)
      tl.fromTo(
        tile,
        { scale: 0.82, y: 12, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: true },
        0.02
      );

      // magnifier-with-upload-arrow draws stroke-by-stroke (power2.out — pens don't bounce),
      // staggered ~75% so the eye reads continuous pen motion; completes as VO names LegiSense
      tl.fromTo(
        strokes[0],
        { strokeDashoffset: lensLen },
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out", immediateRender: true },
        0.28
      );
      tl.fromTo(
        strokes[1],
        { strokeDashoffset: strokes[1].getTotalLength() },
        { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
        0.52
      );
      tl.fromTo(
        strokes[2],
        { strokeDashoffset: strokes[2].getTotalLength() },
        { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
        0.66
      );
      tl.fromTo(
        strokes[3],
        { strokeDashoffset: strokes[3].getTotalLength() },
        { strokeDashoffset: 0, duration: 0.15, ease: "power2.out" },
        0.8
      );

      // ═══ Scene 2 (1.021 - 1.949s) · wordmark cascades; tagline locks up ═══

      // dynamic-content-sequencing: per-group slot computed from content length
      // (BASE 0.06s + chars × SEC_PER_CHAR 0.045s), pre-computed once at build
      var BASE = 0.06;
      var SEC_PER_CHAR = 0.045;
      var cursor = S2;
      groups.forEach(function (el) {
        var slot = BASE + el.textContent.length * SEC_PER_CHAR;
        tl.fromTo(
          el,
          { y: 36, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.38, ease: "power3.out", immediateRender: false },
          cursor
        );
        cursor += slot;
      });

      // tracking holds the final lockup value statically (layout properties
      // snap under seek-by-frame capture; transforms only are animated)
      gsap.set(wordmark, { letterSpacing: "-0.02em" });

      // tagline fades up on its spoken cue, smooth settle
      tl.fromTo(
        tagline,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.36, ease: "power2.out", immediateRender: true },
        1.58
      );

      // ═══ Scene 3 (1.949 - 3.712s) · breather: line draws, glow blooms once, hold ═══

      // the 60px accent line draws under the tagline (svg-path-draw)
      tl.fromTo(
        accentLine,
        { strokeDashoffset: accentLen },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out", immediateRender: true },
        S3 + 0.03
      );

      // single bounded glow blooms once behind the mark (ambient-glow-bloom,
      // pulse-on-arrival: swell just past peak, settle to a steady hold — no loop)
      var GLOW_PEAK = 0.3;
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.86 },
        {
          opacity: GLOW_PEAK + 0.04,
          scale: 1.05,
          duration: 0.62,
          ease: "power2.out",
          immediateRender: true,
        },
        S3 + 0.4
      );
      tl.fromTo(
        glow,
        { opacity: GLOW_PEAK + 0.04, scale: 1.05 },
        {
          opacity: GLOW_PEAK - 0.04,
          scale: 1,
          duration: 0.5,
          ease: "power1.out",
          immediateRender: false,
        },
        S3 + 1.02
      );

      // completed lockup holds still through 3.712s — deliberate breather, no further motion
    })();
  </script>
</template>
