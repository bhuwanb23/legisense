  <script>
    (function () {
      var D = 10;
      var Q_TEXT = "Can my landlord raise the rent by 15%?";
      var CLEAR_T = 2.96;

      function el(id) {
        return document.getElementById(id);
      }
      var typedEl = el("06-typed");
      var caretEl = el("06-caret");
      var phEl = el("06-ph");
      var ringEl = el("06-ring");
      var qEl = el("06-bubble-q");
      var aEl = el("06-bubble-a");
      var thinkEl = el("06-thinking");
      var dots = [el("06-dot1"), el("06-dot2"), el("06-dot3")];
      var chunkEls = [el("06-chunk1"), el("06-chunk2"), el("06-chunk3")];
      var chip1 = el("06-chip1");
      var chip2 = el("06-chip2");
      var sendBtn = el("06-send");
      var burstEl = el("06-burst");

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-cited-chat"] = tl;

      /* ---- Scene 1 (0.0-2.8): focus ring, discrete-text-sequence typing, square-wave caret ---- */
      var SEQUENCE = [{ t: 0, text: "" }];
      (function () {
        var START = 0.3, STEP = 0.042, WPAUSE = 0.11;
        var tt = START, acc = "";
        var words = Q_TEXT.split(" ");
        for (var w = 0; w < words.length; w++) {
          var word = words[w];
          for (var c = 0; c < word.length; c++) {
            acc += word[c];
            SEQUENCE.push({ t: tt, text: acc });
            tt += STEP;
          }
          if (w < words.length - 1) {
            acc += " ";
            SEQUENCE.push({ t: tt, text: acc });
            tt += WPAUSE;
          }
        }
      })();

      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      var drv = { t: 0 };
      tl.to(
        drv,
        {
          t: D,
          duration: D,
          ease: "none",
          onUpdate: function () {
            typedEl.textContent = drv.t >= CLEAR_T ? "" : textAt(drv.t);
          },
        },
        0
      );

      var CYCLES = 16;
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * CYCLES,
          duration: D,
          ease: "none",
          onUpdate: function () {
            caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        0
      );

      tl.fromTo(
        ringEl,
        { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
        0.12
      );
      tl.set(phEl, { opacity: 0 }, 0.26);

      /* ---- Scene 2 (2.8-4.0): press-release-spring on send, bubble snaps up, three finite dot pulses ---- */
      tl.set(phEl, { opacity: 1 }, 3.0);
      tl.fromTo(
        sendBtn,
        { scale: 1 },
        { scale: 0.9, duration: 0.12, ease: "power1.in" },
        2.84
      );
      tl.to(sendBtn, { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 2.96);
      tl.fromTo(
        burstEl,
        { scale: 1, opacity: 0 },
        { scale: 3.2, opacity: 0.55, duration: 0.35, ease: "power2.out" },
        2.96
      );
      tl.to(burstEl, { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.28);
      tl.to(ringEl, { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.88);

      tl.fromTo(
        qEl,
        { opacity: 0, y: 26, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" },
        3.02
      );
      tl.fromTo(
        aEl,
        { opacity: 0, y: 18, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
        3.18
      );

      for (var wv = 0; wv < 3; wv++) {
        for (var di = 0; di < 3; di++) {
          var st = 3.3 + wv * 0.22 + di * 0.07;
          tl.to(dots[di], { scale: 1.45, duration: 0.09, ease: "power2.out" }, st);
          tl.to(dots[di], { scale: 1, duration: 0.13, ease: "power2.inOut" }, st + 0.09);
        }
      }

      /* ---- Scene 3 (4.0-7.5): streamed answer, citation chips spring in ---- */
      tl.to(thinkEl, { opacity: 0, duration: 0.22, ease: "power2.in" }, 4.02);

      function stream(span, txt, start, dur) {
        var o = { n: 0 };
        tl.to(
          o,
          {
            n: txt.length,
            duration: dur,
            ease: "none",
            onUpdate: function () {
              span.textContent = txt.substring(0, Math.floor(o.n));
            },
          },
          start
        );
      }
      stream(chunkEls[0], "No - not in a single step.", 4.0, 0.8);
      stream(chunkEls[1], " Your agreement caps annual increases at 5%,", 4.8, 1.05);
      stream(chunkEls[2], " and any change needs your written consent.", 5.85, 0.9);

      tl.fromTo(
        chip1,
        { opacity: 0, scale: 0.4, y: 8 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.9)" },
        6.55
      );
      tl.fromTo(
        chip2,
        { opacity: 0, scale: 0.4, y: 8 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.9)" },
        6.82
      );

      /* ---- Scene 4 (7.5-10.0): hold; only the caret's finite square-wave blink continues ---- */
    })();
