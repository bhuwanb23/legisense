<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="sh5">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg5)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Database Schema</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">26 tables · SQLite + Drizzle ORM · AES-256 at rest</text>

  <!-- Core tables -->
  <!-- Users -->
  <rect x="40" y="80" width="160" height="100" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="120" y="100" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">users</text>
  <text x="50" y="118" fill="#a7f3d0" font-size="8">id · email · full_name</text>
  <text x="50" y="132" fill="#a7f3d0" font-size="8">auth_provider · password_hash</text>
  <text x="50" y="146" fill="#a7f3d0" font-size="8">preferred_language</text>
  <text x="50" y="160" fill="#a7f3d0" font-size="8">default_jurisdiction</text>
  <text x="50" y="174" fill="#a7f3d0" font-size="8">oauth_subject</text>

  <!-- Documents -->
  <rect x="240" y="80" width="180" height="120" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="330" y="100" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">documents</text>
  <text x="250" y="118" fill="#a7f3d0" font-size="8">id · user_id → users</text>
  <text x="250" y="132" fill="#a7f3d0" font-size="8">original_name · storage_path</text>
  <text x="250" y="146" fill="#a7f3d0" font-size="8">file_format · file_size</text>
  <text x="250" y="160" fill="#a7f3d0" font-size="8">raw_text · encryption_iv</text>
  <text x="250" y="174" fill="#a7f3d0" font-size="8">detected_type · processing_status</text>
  <text x="250" y="188" fill="#a7f3d0" font-size="8">country_code · state_code</text>

  <!-- Analysis Results -->
  <rect x="450" y="80" width="200" height="120" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="550" y="100" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">analysis_results</text>
  <text x="460" y="118" fill="#93c5fd" font-size="8">id · document_id → documents</text>
  <text x="460" y="132" fill="#93c5fd" font-size="8">user_id · document_type</text>
  <text x="460" y="146" fill="#93c5fd" font-size="8">overall_risk_score · risk_level</text>
  <text x="460" y="160" fill="#93c5fd" font-size="8">fairness_score · favors_party</text>
  <text x="460" y="174" fill="#93c5fd" font-size="8">summary · key_parties (JSON)</text>
  <text x="460" y="188" fill="#93c5fd" font-size="8">critical_dates · key_obligations</text>

  <!-- Clauses -->
  <rect x="680" y="80" width="190" height="120" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="775" y="100" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">clauses</text>
  <text x="690" y="118" fill="#93c5fd" font-size="8">id · document_id · analysis_id</text>
  <text x="690" y="132" fill="#93c5fd" font-size="8">clause_number · clause_title</text>
  <text x="690" y="146" fill="#93c5fd" font-size="8">original_text · plain_english_text</text>
  <text x="690" y="160" fill="#93c5fd" font-size="8">risk_level · risk_score · risk_category</text>
  <text x="690" y="174" fill="#93c5fd" font-size="8">reading_level · key_legal_terms</text>
  <text x="690" y="188" fill="#93c5fd" font-size="8">counter_suggestion · party_references</text>

  <!-- Arrows: users → documents → analysis_results → clauses -->
  <line x1="200" y1="130" x2="240" y2="130" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrT)"/>
  <line x1="420" y1="140" x2="450" y2="140" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="650" y1="140" x2="680" y2="140" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Risk Items -->
  <rect x="40" y="230" width="170" height="90" rx="8" fill="#451a03" stroke="#d97706" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="125" y="250" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">risk_items</text>
  <text x="50" y="268" fill="#fde68a" font-size="8">id · analysis_id → analysis_results</text>
  <text x="50" y="282" fill="#fde68a" font-size="8">clause_id → clauses</text>
  <text x="50" y="296" fill="#fde68a" font-size="8">risk_type · title · severity</text>
  <text x="50" y="310" fill="#fde68a" font-size="8">recommendation · legal_reference</text>

  <!-- Deadlines -->
  <rect x="230" y="230" width="170" height="90" rx="8" fill="#451a03" stroke="#d97706" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="315" y="250" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">deadlines</text>
  <text x="240" y="268" fill="#fde68a" font-size="8">id · document_id · user_id</text>
  <text x="240" y="282" fill="#fde68a" font-size="8">title · description · due_date</text>
  <text x="240" y="296" fill="#fde68a" font-size="8">recurrence · urgency_level</text>
  <text x="240" y="310" fill="#fde68a" font-size="8">reminder_enabled · reminder_times</text>

  <!-- Chat Messages -->
  <rect x="420" y="230" width="170" height="90" rx="8" fill="#2e1065" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="505" y="250" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">chat_messages</text>
  <text x="430" y="268" fill="#ddd6fe" font-size="8">id · document_id · user_id</text>
  <text x="430" y="282" fill="#ddd6fe" font-size="8">session_id · role · message</text>
  <text x="430" y="296" fill="#ddd6fe" font-size="8">cited_clause_ids · cited_pages</text>
  <text x="430" y="310" fill="#ddd6fe" font-size="8">tokens_used · response_time</text>

  <!-- Jurisdictions -->
  <rect x="610" y="230" width="170" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#sh5)"/>
  <text x="695" y="250" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">jurisdictions</text>
  <text x="620" y="268" fill="#a7f3d0" font-size="8">id · country_code · country_name</text>
  <text x="620" y="282" fill="#a7f3d0" font-size="8">state_code · state_name</text>
  <text x="620" y="296" fill="#a7f3d0" font-size="8">+ legal_rules (per jurisdiction)</text>
  <text x="620" y="310" fill="#a7f3d0" font-size="8">+ jurisdiction_flags (per doc)</text>

  <!-- Support tables row -->
  <rect x="40" y="350" width="130" height="50" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="105" y="372" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">glossary</text>
  <text x="105" y="388" text-anchor="middle" fill="#64748b" font-size="7">200+ legal terms</text>

  <rect x="185" y="350" width="130" height="50" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="250" y="372" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">risk_patterns</text>
  <text x="250" y="388" text-anchor="middle" fill="#64748b" font-size="7">50+ risky patterns</text>

  <rect x="330" y="350" width="130" height="50" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="395" y="372" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">required_clauses</text>
  <text x="395" y="388" text-anchor="middle" fill="#64748b" font-size="7">per doc type templates</text>

  <rect x="475" y="350" width="130" height="50" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="540" y="372" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">playbook_rules</text>
  <text x="540" y="388" text-anchor="middle" fill="#64748b" font-size="7">user-defined rules</text>

  <rect x="620" y="350" width="130" height="50" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="685" y="372" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">clause_risk_flags</text>
  <text x="685" y="388" text-anchor="middle" fill="#64748b" font-size="7">pattern matches</text>

  <rect x="765" y="350" width="105" height="50" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="817" y="372" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">share_links</text>
  <text x="817" y="388" text-anchor="middle" fill="#64748b" font-size="7">public analysis URLs</text>

  <!-- More tables -->
  <rect x="40" y="415" width="130" height="45" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="105" y="435" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">sessions</text>
  <text x="105" y="449" text-anchor="middle" fill="#64748b" font-size="7">refresh tokens</text>

  <rect x="185" y="415" width="130" height="45" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="250" y="435" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">notifications</text>
  <text x="250" y="449" text-anchor="middle" fill="#64748b" font-size="7">user alerts</text>

  <rect x="330" y="415" width="130" height="45" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="395" y="435" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">usage_logs</text>
  <text x="395" y="449" text-anchor="middle" fill="#64748b" font-size="7">AI cost tracking</text>

  <rect x="475" y="415" width="130" height="45" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="540" y="435" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">api_keys</text>
  <text x="540" y="449" text-anchor="middle" fill="#64748b" font-size="7">external API auth</text>

  <rect x="620" y="415" width="130" height="45" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="685" y="435" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">document_collaborators</text>
  <text x="685" y="449" text-anchor="middle" fill="#64748b" font-size="7">team sharing</text>

  <rect x="765" y="415" width="105" height="45" rx="6" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="817" y="435" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">queue_jobs</text>
  <text x="817" y="449" text-anchor="middle" fill="#64748b" font-size="7">async processing</text>

  <defs>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>