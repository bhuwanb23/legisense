<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="sh7">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg7)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">AI Provider Fallback Chain</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="11">Automatic failover with task-aware routing</text>

  <!-- Ollama (Primary for analysis) -->
  <rect x="40" y="80" width="160" height="70" rx="10" fill="#1a2332" stroke="#10b981" stroke-width="2" filter="url(#sh7)"/>
  <text x="120" y="105" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">🦙 Ollama</text>
  <text x="120" y="122" text-anchor="middle" fill="#6ee7b7" font-size="9">Local · Free · Fast</text>
  <text x="120" y="138" text-anchor="middle" fill="#6ee7b7" font-size="8">Analysis · Classification</text>

  <!-- Arrow -->
  <line x1="200" y1="115" x2="230" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- Gemini -->
  <rect x="230" y="80" width="160" height="70" rx="10" fill="#1a2332" stroke="#3b82f6" stroke-width="2" filter="url(#sh7)"/>
  <text x="310" y="105" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">✨ Gemini</text>
  <text x="310" y="122" text-anchor="middle" fill="#60a5fa" font-size="9">Cloud · Large context</text>
  <text x="310" y="138" text-anchor="middle" fill="#60a5fa" font-size="8">Chat · Rewrite · Multilingual</text>

  <!-- Arrow -->
  <line x1="390" y1="115" x2="420" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- OpenRouter -->
  <rect x="420" y="80" width="160" height="70" rx="10" fill="#1a2332" stroke="#f59e0b" stroke-width="2" filter="url(#sh7)"/>
  <text x="500" y="105" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">🔀 OpenRouter</text>
  <text x="500" y="122" text-anchor="middle" fill="#fbbf24" font-size="9">Multi-model gateway</text>
  <text x="500" y="138" text-anchor="middle" fill="#fbbf24" font-size="8">Fallback for cloud tasks</text>

  <!-- Arrow -->
  <line x1="580" y1="115" x2="610" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- OpenAI -->
  <rect x="610" y="80" width="160" height="70" rx="10" fill="#1a2332" stroke="#8b5cf6" stroke-width="2" filter="url(#sh7)"/>
  <text x="690" y="105" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="700">🤖 OpenAI</text>
  <text x="690" y="122" text-anchor="middle" fill="#c4b5fd" font-size="9">GPT-4o · Premium</text>
  <text x="690" y="138" text-anchor="middle" fill="#c4b5fd" font-size="8">Last resort · Best quality</text>

  <!-- Fallback arrow (dashed, curved back) -->
  <path d="M 690,150 Q 690,180 610,180 Q 120,180 120,150" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="400" y="190" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="600">On failure → try next provider → repeat</text>

  <!-- Selection logic box -->
  <rect x="790" y="80" width="85" height="70" rx="10" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="832" y="105" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">Routing</text>
  <text x="832" y="122" text-anchor="middle" fill="#64748b" font-size="7">Chat → Cloud</text>
  <text x="832" y="135" text-anchor="middle" fill="#64748b" font-size="7">Analysis → Local</text>
  <text x="832" y="148" text-anchor="middle" fill="#64748b" font-size="7">Large → Gemini</text>

  <defs>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>